name: Fetch Real Estate Data Daily

on:
  schedule:
    # 每天北京时间上午5点运行 (UTC时间前一天21点)
    - cron: '0 21 * * *'
    # 每天北京时间上午12点运行 (UTC时间上午4点)
    - cron: '0 4 * * *'
  workflow_dispatch: # 允许手动触发

jobs:
  fetch-data:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Chrome and xvfb
      run: |
        sudo apt-get update
        sudo apt-get install -y xvfb google-chrome-stable || sudo apt-get install -y xvfb chromium-browser

    - name: Install dependencies
      run: npm ci

    - name: Fetch real estate data
      # JSL 反爬要求真实"有头"浏览器（headless 会被 400）。
      # GitHub Actions Linux runner 没有显示器，用 xvfb 提供虚拟 X 显示，
      # 让 Chrome 以正常有头模式运行。
      run: xvfb-run -a --server-args="-screen 0 1600x1000x24" npm start

    - name: Configure Git
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'

    - name: Commit and push changes
      run: |
        # 检查是否有文件更改
        if [ -n "$(git status --porcelain)" ]; then
          git add .
          git commit -m "Update real estate data [Daily automated update]
          
          - Updated daily data: $(date +%Y-%m-%d)
          - Updated monthly data: $(date +%Y-%m)"
          git push
          echo "Changes committed and pushed"
        else
          echo "No changes to commit"
        fi
